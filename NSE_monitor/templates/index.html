<!DOCTYPE html>
<html lang="en">

    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title> NSE Live Monitor | Kenya </title>
    <style>
    * {margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        font-family: 'Segoe UI', tahoma, Geneva, verdana, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 20px;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 2rem;
        color: #38bdf8;
        margin-bottom: 5px;
    }

    .header p {
        color: #94a3b8;
    }
    
    .status-bar {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 25px;
    flex-wrap: wrap;
    }

    .status-item {
        background: #1e293b;
        padding: 12px 25px;
        border-radius: 10px;
        text-align: center;
    }

    .status-item .label {
        font-size: 0.85rem;
        color: #94a3b8;
    }

    .status-item .value {
        font-size: 1.3rem;
        font-weight: bold;
        color: #38bdf8;
    }

    .controls {
        text-align: center;
        margin-bottom: 25px;
    }
    
    button {
        background: #0284c7;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 1rem;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #0369a1;
    }

    .alert-banner {
        background: #7f1d1d;
        color: #fecaca;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 1.1rem;
        display: none;
    } 

    .alert-banner.show {
        display: block;
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        background: #1e293b;
        border-radius: 12px;
        overflow: hidden;

    }

    th {
        background: #0f172a;
        padding: 14px 12px;
        text-align: left;
        color: #94a3b8;
        font-weight: 600;
    }

    td {
        padding: 13px 12px;
        border-top: 1px solid #334155;
    }

    tr:hover {
        background: #334155;
    }

    .action {
        padding: 5px 12px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.85rem;
        display: inline-block;
    }

    .BUY {
        background: #14532d;
        color: #4ade80;
    }

    .SELL {
        background: #7f1d1d;
        color: #f87171;
    }

    .WATCH {
        background: #1e3a5f;
        color: #38bdf8;
    }

    .positive {
        color: #4ade80;
    }
    
    .negative {
        color: #f87171;
    }

    .reasons {
        font-size: 0.85rem;
        color: #94a3b8;
    }

    .footer {
        text-align : center;
        margin-top: 30px;
        color: #64748b;
        font-size: 0.9rem;
    }
   </style>
</head>
